name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Vendor bundle is up to date
        run: |
          npm run build:vendor
          git diff --exit-code -- app/public/assets/vendor/ || {
            echo "::error::app/public/assets/vendor/collab.bundle.js is stale — run 'npm run build:vendor' and commit it."
            exit 1
          }
